# Builds Glass Launcher and runs it on real Android emulators (Android 5.0, 8.0, 11, 14):
# installs it, makes it the home app, runs the head-unit setup script against the emulator,
# opens every screen, stress-taps it with the Android monkey tool, fails on any crash and
# uploads screenshots + logs as the "emulator-<api>" artifacts.
name: Glass Launcher on Android emulators

on:
  push:
    paths: ['glass-launcher/**', '.github/workflows/glass-launcher-emulator.yml']
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [21, 26, 30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: glass-launcher
        run: ./build.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api >= 30 && 'google_apis' || 'default' }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1280x720
          disable-animations: false
          script: bash glass-launcher/tools/emulator-check.sh ${{ matrix.api }}

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ matrix.api }}
          path: glass-launcher/emulator-out/
