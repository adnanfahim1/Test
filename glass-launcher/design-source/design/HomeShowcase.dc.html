<div style="position: relative; --accent: {{accent}}; background: {{ground}}; width: 1280px; height: 720px; box-sizing: border-box; padding: 24px; color: #F2F3F5; font-family: Manrope, sans-serif; display: flex; flex-direction: row-reverse; gap: 20px; overflow: hidden">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gBlue" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#8FB3FF"></stop><stop offset="1" stop-color="#3D5AFE"></stop></linearGradient>
      <linearGradient id="gViolet" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#D4B8FF"></stop><stop offset="1" stop-color="#7C5CFF"></stop></linearGradient>
      <linearGradient id="gTeal" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#8FF5DF"></stop><stop offset="1" stop-color="#1FAE9F"></stop></linearGradient>

      <linearGradient id="gDot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9FFF0"></stop><stop offset="1" stop-color="#2BC4B4"></stop></linearGradient>
    </defs>
  </svg>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">

        <span>{{dateLabel}}</span>

      <button class="spinbtn" aria-label="{{spinLabel}}" onClick="{{toggleSpin}}" style="all: unset; cursor: pointer; position: relative; display: block; margin-top: 6px">

    </div>
  </div><nav aria-label="Main" class="rise" style="width: 88px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 0; border-radius: 28px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 16px 48px rgba(4,4,8,0.45)">

        <span style="font-size: 11px; color: #C8CAD1">{{r.short}}</span>
      </a>
    </sc-for>
    <a href="Main.dc.html" aria-current="page" style="margin-top: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 72px; height: 72px; border-radius: 18px; text-decoration: none; color: #FFFFFF; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 22px {{accentGlow}}">
      <svg class="railicon" width="38" height="38" viewBox="0 0 64 64" aria-hidden="true"><path d="{{homeIcon.back}}" fill="url(#gViolet)"></path><path d="{{homeIcon.front}}" fill="url(#gFrost)" stroke="rgba(255,255,255,0.75)" stroke-width="0.8"></path><path d="{{homeIcon.dot}}" fill="url(#gBlue)"></path></svg>
      Home
    </a>
  </nav>

  

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status" style="position: absolute; left: 50%; bottom: 168px; z-index: 40; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 18px; background: rgba(22,23,28,0.85); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 16px 40px rgba(0,0,0,0.45); font-size: 16px; color: #F2F3F5; white-space: nowrap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01"></path></svg>
      {{toast}}
    </div>
  </sc-if>
</div>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Violet","Ocean","Emerald","Rose"],"default":"Violet"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  themeVals() {
    const T = {

    const name = (this.state && this.state.theme) || this.props.theme || 'Violet';
    const t = T[name] || T.Violet;
    const g = t.g;
    return {
      accent: t.a,
      themeName: name,
      ground: 'radial-gradient(680px 460px at 10% -12%, ' + g[0] + ' 0%, transparent 62%), radial-gradient(700px 520px at 105% 110%, ' + g[1] + ' 0%, transparent 60%), radial-gradient(520px 380px at 70% 20%, ' + g[2] + ' 0%, transparent 70%), ' + g[3],
      themes: Object.keys(T).map((n) => ({ label: n, swatch: T[n].a, active: n === name, inactive: n !== name, pick: () => this.setState({ theme: n }) }))
    };
  }
  constructor(props) {
    super(props);

  }

    const gear = (() => {
      const n = 8, ro = 24, ri = 18, pts = [];

        const a = (i / (n * 4)) * Math.PI * 2 - Math.PI / 2;

      maps: { back: 'M8 18l16-7 16 7 16-7v36l-16 7-16-7-16 7z', bg: 'gBlue', front: 'M32 12c-7.7 0-13 5.6-13 12.6C19 34 32 48 32 48s13-14 13-23.4C45 17.6 39.7 12 32 12z', detail: '', dot: ci(32, 25, 4.5), dotFill: 'gDot' },

      phone: { back: rr(9, 9, 46, 46, 15), bg: 'gTeal', front: 'M22 17c2.4-2.4 5.6-2 6.8 1.2l2 5.2c.8 2.2 0 4.2-2 5.4l-1.6 1c2 4.6 5.6 8.4 10.2 10.4l1-1.6c1.2-2 3.2-2.8 5.4-2l5.2 2c3.2 1.2 3.6 4.4 1.2 6.8l-2.6 2.6c-3.4 3.4-10 1.8-17-5.2s-8.6-13.6-5.2-17z', detail: '', dot: '', dotFill: 'gDot' },
      radio: { back: rr(7, 19, 50, 36, 11), bg: 'gBlue', front: rr(12, 25, 24, 24, 8), detail: 'M42 30h9M42 37h9M42 44h9M18 19L42 7', dot: ci(24, 37, 5), dotFill: 'gDot' },
      camera: { back: rr(7, 19, 50, 36, 11) + rr(21, 11, 22, 12, 5), bg: 'gViolet', front: ci(32, 37, 13), detail: '', dot: ci(32, 37, 7.5) + ci(49, 26, 2.5), dotFill: 'gBlue' },
      link: { back: rr(17, 6, 30, 52, 9), bg: 'gBlue', front: rr(21, 12, 22, 36, 5), detail: '', dot: ci(32, 52.5, 2.6), dotFill: 'gDot' },
      bt: { back: ci(32, 32, 23), bg: 'gBlue', front: '', detail: 'M24 24l16 16-8 7V17l8 7-16 16', dot: '', dotFill: 'gDot' },
      video: { back: rr(7, 13, 50, 38, 11), bg: 'gViolet', front: 'M27 22.5c0-2 2.2-3.2 3.8-2.1l11 7.4c1.5 1 1.5 3.2 0 4.2l-11 7.4c-1.6 1.1-3.8-.1-3.8-2.1z', detail: '', dot: '', dotFill: 'gDot' },
      gallery: { back: rr(16, 7, 40, 40, 11), bg: 'gTeal', front: rr(8, 16, 40, 40, 11), detail: 'M14 49l9-11 7 7 5-5 8 9', dot: ci(36, 28, 4.5), dotFill: 'gSun' },
      files: { back: 'M7 18a7 7 0 0 1 7-7h11l6 6h19a7 7 0 0 1 7 7v24a7 7 0 0 1-7 7H14a7 7 0 0 1-7-7z', bg: 'gBlue', front: 'M12 28a5 5 0 0 1 5-5h36a4 4 0 0 1 4 4.8l-3.8 21.4A6 6 0 0 1 47.3 54H11.5a4 4 0 0 1-4-4.8z', detail: '', dot: '', dotFill: 'gDot' },
      browser: { back: ci(32, 32, 23), bg: 'gBlue', front: '', detail: 'M10 32h44M32 10c-8 7-8 37 0 44M32 10c8 7 8 37 0 44M14 21h36M14 43h36', dot: '', dotFill: 'gDot' },
      store: { back: rr(9, 20, 46, 36, 11), bg: 'gViolet', front: rr(16, 30, 32, 18, 7), detail: 'M22 22v-4a10 10 0 0 1 20 0v4', dot: ci(47, 24, 5), dotFill: 'gDot' },
      eq: { back: rr(9, 9, 46, 46, 15), bg: 'gViolet', front: '', detail: 'M21 18v28M32 18v28M43 18v28', dot: ci(21, 38, 5) + ci(32, 24, 5) + ci(43, 34, 5), dotFill: 'gDot' },
      weather: { back: ci(40, 24, 13), bg: 'gSun', front: 'M17 52h31a10 10 0 0 0 0-20 14 14 0 0 0-26.6 3.4A8.4 8.4 0 0 0 17 52z', detail: '', dot: '', dotFill: 'gDot' },
      calc: { back: rr(13, 6, 38, 52, 11), bg: 'gBlue', front: rr(18, 11, 28, 12, 5), detail: '', dot: ci(23, 31, 3) + ci(32, 31, 3) + ci(41, 31, 3) + ci(23, 40, 3) + ci(32, 40, 3) + ci(41, 40, 3) + ci(23, 49, 3) + ci(32, 49, 3) + ci(41, 49, 3), dotFill: 'gFrost' },
      clock: { back: ci(32, 32, 23), bg: 'gBlue', front: ci(32, 32, 17), detail: 'M32 22v10l7 5', dot: '', dotFill: 'gDot' },
      settings: { back: gear, bg: 'gViolet', front: ci(32, 32, 10), detail: '', dot: ci(32, 32, 5.5), dotFill: 'gDot' },

    };
  }
  renderVals() {
    const tv = this.themeVals();
    const s = this.state;
    const n = s.now;
    const TRACKS = [
      { title: '[Track 1]', artist: '[Artist]', art: 'linear-gradient(160deg, #F7B2A8 0%, #7A5CFF 100%)' },
      { title: '[Track 2]', artist: '[Artist]', art: 'linear-gradient(160deg, #FFD39A 0%, #B35C3C 100%)' },
      { title: '[Track 3]', artist: '[Artist]', art: 'linear-gradient(160deg, #7FE0D0 0%, #1B5E6B 100%)' },
      { title: '[Track 4]', artist: '[Artist]', art: 'linear-gradient(160deg, #C9D6FF 0%, #B07BE8 100%)' }
    ];
    const h = n.getHours();
    const showToast = (msg) => { clearTimeout(this.toastT); this.setState({ toast: msg }); this.toastT = setTimeout(() => this.setState({ toast: '' }), 2400); };
    const IC = this.icons();
    const KEY = { 'Navigation': 'maps', 'Music': 'music', 'All apps': 'apps', 'Car settings': 'car', 'Settings': 'settings' };
    const R = (label, href, icon, short) => ({ label, href, short, ...IC[KEY[label]], tap: href === '#' ? (e) => { e.preventDefault(); showToast('This opens your maps app on the head unit'); } : undefined });
    return {
      ...tv,
      accentGlow: tv.accent + '88',
      greeting: h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening',
      timeShort: ((h % 12) || 12) + ':' + String(n.getMinutes()).padStart(2, '0'),
      ampm: h < 12 ? 'AM' : 'PM',
      timeLabel: ((h % 12) || 12) + ':' + String(n.getMinutes()).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM'),
      dateLabel: n.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }),
      homeIcon: IC.home,
      rail: [
        R('Navigation', '#', 'M3 11l19-9-9 19-2-8-8-2z', 'Maps'),
        R('Music', 'Media.dc.html', 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z', 'Music'),
        R('All apps', 'AppDrawer.dc.html', 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z', 'Apps'),
        R('Car settings', 'CarSettings.dc.html', 'M5 17h14M3 17v-5l2-5h14l2 5v5M7 17v2M17 17v2M6.5 13.5h.01M17.5 13.5h.01', 'Car'),
        R('Settings', 'Settings.dc.html', 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6', 'Settings')
      ],
      stats: [
        { label: 'Trip time', value: '[--]' },
        { label: 'Distance', value: '[--] km' },
        { label: 'Avg speed', value: '[--] km/h' },
        { label: 'Odometer', value: '[--] km' }
      ],
      carTransform: 'rotateX(' + s.rx.toFixed(2) + 'deg) rotateY(' + s.ry.toFixed(2) + 'deg) translateZ(' + (s.hover ? 30 : 0) + 'px) scale(' + (s.pressed ? 0.95 : 1) + ')',
      shadowTransform: 'translateX(' + (-s.ry * 2).toFixed(1) + 'px) scale(' + (s.pressed ? 0.9 : 1 - Math.abs(s.ry) / 90).toFixed(3) + ')',
      gx: s.gx.toFixed(1),
      gy: s.gy.toFixed(1),
      glareOpacity: s.hover ? 1 : 0.35,
      lightsOpacity: s.lights ? 1 : 0,
      lightsColor: s.lights ? '#FFE9A8' : '#B3B5BD',
      lightsChip: s.lights ? 'Lights on' : 'Tap car for lights',
      lightsLabel: s.lights ? 'Turn headlight preview off' : 'Turn headlight preview on',
      lightsPressed: s.lights ? 'true' : 'false',
      tilt: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        this.setState({ ry: x * 26, rx: -y * 18, gx: (x + 0.5) * 100, gy: (y + 0.5) * 100, hover: true });
      },
      untilt: () => this.setState({ rx: 0, ry: 0, gx: 50, gy: 30, hover: false, pressed: false }),
      press: () => this.setState({ pressed: true }),
      release: () => this.setState({ pressed: false }),
      toggleLights: () => this.setState({ lights: !s.lights }),
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? 'Pause' : 'Play',
      spinState: s.playing ? 'running' : 'paused',
      togglePlay: () => this.setState({ playing: !s.playing }),
      isOn: s.phone === 'on',
      isOff: s.phone === 'off',
      isConnecting: s.phone === 'connecting',
      mapOpacity: s.phone === 'on' ? 1 : 0.25,
      connect: () => {
        if (s.phone !== 'off') return;
        this.setState({ phone: 'connecting' });
        this.pairing = setTimeout(() => this.setState({ phone: 'on' }), 1600);
      },
      phoneChipAction: () => {
        if (s.phone === 'on') { this.setState({ phone: 'off' }); return; }
        if (s.phone === 'off') {
          this.setState({ phone: 'connecting' });
          this.pairing = setTimeout(() => this.setState({ phone: 'on' }), 1600);
        }
      },
      phoneChipText: s.phone === 'on' ? '[Phone] connected' : s.phone === 'connecting' ? 'Connecting…' : 'No phone',
      phoneChipLabel: s.phone === 'on' ? 'Phone connected. Tap to disconnect' : s.phone === 'connecting' ? 'Connecting to phone' : 'No phone connected. Tap to connect',
      phoneChipBg: s.phone === 'on' ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.06)',
      phoneDot: s.phone === 'on' ? '#34D399' : s.phone === 'connecting' ? '#FBBF24' : '#9A9CA5',
      phoneDotClass: s.phone === 'connecting' ? 'dotpulse' : '',
      track: TRACKS[s.track],
      prevTrack: () => this.setState({ track: (s.track + TRACKS.length - 1) % TRACKS.length, playing: true }),
      nextTrack: () => this.setState({ track: (s.track + 1) % TRACKS.length, playing: true }),
      volume: s.muted ? 0 : s.volume,
      volLabel: s.muted ? 'Muted' : String(s.volume),
      setVolume: (e) => this.setState({ volume: Number(e.target.value), muted: Number(e.target.value) === 0 }),
      muted: s.muted || s.volume === 0,
      unmuted: !(s.muted || s.volume === 0),
      mutedPressed: s.muted ? 'true' : 'false',
      muteLabel: s.muted ? 'Unmute' : 'Mute',
      toggleMute: () => this.setState({ muted: !s.muted, volume: s.volume === 0 ? 12 : s.volume }),
      spinning: !s.spinOff,
      stopped: !!s.spinOff,
      spinPlay: s.spinOff ? 'paused' : 'running',
      spinChip: s.spinOff ? 'Tap to rotate' : 'Tap to pause',
      spinLabel: s.spinOff ? 'Resume 360 rotation' : 'Pause 360 rotation',
      toggleSpin: () => this.setState({ spinOff: !s.spinOff }),
      hasToast: !!s.toast,
      toast: s.toast,
      openMaps: (e) => { e.preventDefault(); showToast('This opens your maps app on the head unit'); }
    };
  }
}
</script>
