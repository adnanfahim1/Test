<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now Playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Manrope:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.55);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
button,a,input{-webkit-tap-highlight-color:transparent}
button,a{transition:transform .22s cubic-bezier(.2,.8,.2,1),filter .25s ease,box-shadow .3s ease,background-color .3s ease !important}
button:hover,a:hover{filter:brightness(1.15)}
button:active,a:active{transform:scale(.95) !important;filter:brightness(1.3)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.stagger>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.stagger>*:nth-child(1){animation-delay:150ms}.stagger>*:nth-child(2){animation-delay:180ms}.stagger>*:nth-child(3){animation-delay:210ms}.stagger>*:nth-child(4){animation-delay:240ms}.stagger>*:nth-child(5){animation-delay:270ms}.stagger>*:nth-child(6){animation-delay:300ms}.stagger>*:nth-child(7){animation-delay:330ms}.stagger>*:nth-child(8){animation-delay:360ms}.stagger>*:nth-child(9){animation-delay:390ms}.stagger>*:nth-child(10){animation-delay:420ms}.stagger>*:nth-child(11){animation-delay:450ms}.stagger>*:nth-child(12){animation-delay:480ms}.stagger>*:nth-child(13){animation-delay:510ms}.stagger>*:nth-child(14){animation-delay:540ms}.stagger>*:nth-child(15){animation-delay:570ms}.stagger>*:nth-child(16){animation-delay:600ms}.stagger>*:nth-child(17){animation-delay:630ms}.stagger>*:nth-child(18){animation-delay:660ms}
main>*{animation:fade .38s cubic-bezier(.2,.8,.2,1) both}main>*:nth-child(2){animation-delay:70ms}main>*:nth-child(3){animation-delay:105ms}main>*:nth-child(4){animation-delay:140ms}main>*:nth-child(5){animation-delay:175ms}main>*:nth-child(6){animation-delay:210ms}main>*:nth-child(7){animation-delay:245ms}main>*:nth-child(8){animation-delay:280ms}main>*:nth-child(9){animation-delay:315ms}
.sw{appearance:none;-webkit-appearance:none;margin:0;flex-shrink:0;box-sizing:border-box;position:relative;width:60px;height:34px;border-radius:17px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);cursor:pointer;transition:background-color .3s ease,box-shadow .3s ease}
.sw::before{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .38s cubic-bezier(.3,1.4,.5,1),width .2s ease}
.sw:checked{background:var(--accent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent)}
.sw:checked::before{transform:translateX(26px)}
.sw:active::before{width:30px}.sw:checked:active::before{transform:translateX(20px)}
.knob{transition:top .45s cubic-bezier(.3,1.3,.5,1)}
.pp svg{animation:pop .32s cubic-bezier(.2,.8,.2,1)}
input[type=range]{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
a{color:#C7C9D6}a:hover{color:#E3E4EA}


@keyframes spin{to{transform:rotate(360deg)}}
.disc{animation:spin 7s linear infinite}
.arm{transition:transform .7s cubic-bezier(.3,1.25,.5,1)}
.ind{transition:left .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes eqb{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
.eqbars>span{transform-origin:bottom;animation:eqb .55s ease-in-out infinite alternate}
.eqbars>span:nth-child(2){animation-delay:.18s}.eqbars>span:nth-child(3){animation-delay:.36s}
.lyr{animation:fade .4s cubic-bezier(.2,.8,.2,1) both}
.seek{transition:filter .2s}
.row{transition:background-color .35s ease,border-color .35s ease}

@keyframes wheelspin{to{transform:rotate(360deg)}}
@keyframes loaderOut{0%,60%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
@keyframes wheelIn{from{transform:translateX(-40px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.loader{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(12,12,16,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none;animation:loaderOut .75s ease forwards}
.loader .wheelwrap{animation:wheelIn .3s cubic-bezier(.2,.8,.2,1) both}
.loader .wheel{animation:wheelspin .55s linear infinite}
@media (prefers-reduced-motion:reduce){.loader{display:none !important}}

@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.toast{animation:toastIn .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes popin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pop-in{animation:popin .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes volIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.volpop{animation:volIn .25s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom right}
</style>
</helmet>
<div style="--accent: {{accent}}; background: {{ground}}; position: relative; width: 1280px; height: 720px; box-sizing: border-box; padding: 28px 32px 24px; color: #F2F3F5; font-family: Manrope, sans-serif; display: flex; flex-direction: row-reverse; gap: 40px; overflow: hidden">
  <div class="loader" role="status" aria-label="Loading">
    <span class="wheelwrap" style="display: block">
      <svg class="wheel" width="56" height="56" viewBox="0 0 64 64" aria-hidden="true" style="display: block">
        <circle cx="32" cy="32" r="28" fill="#1B1C21" stroke="#2E3038" stroke-width="2"></circle>
        <circle cx="32" cy="32" r="19" fill="none" stroke="#CDCFD6" stroke-width="3"></circle>
        <path d="M32 15v10M48.2 26.7l-9.5 3.1M42 45.8l-5.9-8.1M22 45.8l5.9-8.1M15.8 26.7l9.5 3.1" stroke="#CDCFD6" stroke-width="4" stroke-linecap="round"></path>
        <circle cx="32" cy="32" r="6" fill="{{accent}}"></circle>
      </svg>
    </span>
  </div>
  <section class="rise" style="width: 520px; flex-shrink: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
    <div style="position: absolute; right: 0; top: 0; z-index: 20; display: flex; flex-direction: column; gap: 10px">
      <a href="Main.dc.html" aria-label="Back to home" style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.10); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <button aria-label="Lyrics" aria-pressed="{{lyricsPressed}}" onClick="{{toggleLyrics}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 56px; height: 64px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); font-size: 11px; font-weight: 600; background: {{lyricsBg}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"></path></svg>
        Lyrics
      </button>
      <div style="position: relative">
        <button aria-label="Volume {{volLabel}}" aria-expanded="{{volExpanded}}" onClick="{{toggleVol}}" style="all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 56px; height: 64px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); font-size: 11px; font-weight: 600; background: {{volBtnBg}}">
          <sc-if value="{{muted}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5zM22 9l-6 6M16 9l6 6"></path></svg></sc-if>
          <sc-if value="{{unmuted}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"></path></svg></sc-if>
          {{volLabel}}
        </button>
        <sc-if value="{{volOpen}}" hint-placeholder-val="{{ false }}">
          <div class="volpop" style="position: absolute; right: 72px; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; width: 340px; box-sizing: border-box; padding: 12px 14px; border-radius: 20px; background: rgba(32,33,40,0.94); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 18px 44px rgba(0,0,0,0.5)">
            <button aria-label="{{muteLabel}}" aria-pressed="{{mutedPressed}}" onClick="{{toggleMute}}" style="all: unset; cursor: pointer; flex-shrink: 0; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: rgba(255,255,255,0.08)">
              <sc-if value="{{muted}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5zM22 9l-6 6M16 9l6 6"></path></svg></sc-if>
              <sc-if value="{{unmuted}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"></path></svg></sc-if>
            </button>
            <label style="flex-grow: 1; display: flex; align-items: center; gap: 10px">
              <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Volume level</span>
              <input type="range" min="0" max="40" value="{{volume}}" onChange="{{setVolume}}" style="flex-grow: 1; height: 28px; accent-color: {{accent}}">
            </label>
          </div>
        </sc-if>
      </div>
    </div>

    <div style="position: relative; width: 250px; height: 250px; border-radius: 34px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 24px 60px rgba(4,4,8,0.5); display: flex; align-items: center; justify-content: center">
      <sc-if value="{{showDisc}}" hint-placeholder-val="{{ true }}">
        <div class="disc" style="animation-play-state: {{spinState}}; width: 198px; height: 198px; border-radius: 50%; background: repeating-radial-gradient(circle at 50% 50%, #141519 0px, #141519 3px, #202228 4px, #141519 6px); box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 6px rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center">
          <div style="width: 90px; height: 90px; border-radius: 50%; background: {{current.art}}; box-shadow: inset 0 0 0 3px rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center">
            <div style="width: 14px; height: 14px; border-radius: 50%; background: #0A0818; box-shadow: 0 0 0 3px rgba(255,255,255,0.4)"></div>
          </div>
        </div>
        <svg class="arm" width="86" height="148" viewBox="0 0 110 190" style="position: absolute; right: 4px; top: 4px; transform-origin: 62px 23px; transform: {{armTransform}}" aria-hidden="true">
          <circle cx="80" cy="30" r="18" fill="#2A2C33" stroke="rgba(255,255,255,0.25)" stroke-width="2"></circle>
          <circle cx="80" cy="30" r="7" fill="#C8CAD1"></circle>
          <path d="M80 30 L72 128 L50 166" fill="none" stroke="#C8CAD1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
          <rect x="34" y="158" width="24" height="16" rx="4" transform="rotate(-30 46 166)" fill="#E6E7EB"></rect>
        </svg>
      </sc-if>
      <sc-if value="{{lyrics}}" hint-placeholder-val="{{ false }}">
        <div class="lyr" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px; text-align: center">
          <div style="font-size: 16px; color: #B3B5BD">[Previous line]</div>
          <div style="font-family: 'Barlow Semi Condensed', sans-serif; font-size: 30px; font-weight: 600">[Current lyric line]</div>
          <div style="font-size: 16px; color: #B3B5BD">[Next line]</div>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="font-family: 'Barlow Semi Condensed', sans-serif; font-size: 34px; font-weight: 600">{{current.title}}</div>
      <div style="font-size: 18px; color: #B3B5BD">{{current.artist}}</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; width: 460px">
      <button aria-label="Shuffle" aria-pressed="{{shufflePressed}}" onClick="{{toggleShuffle}}" style="all: unset; cursor: pointer; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{shuffleColor}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>
      </button>
      <button aria-label="Previous track" onClick="{{prev}}" style="all: unset; cursor: pointer; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 20px">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#F2F3F5" aria-hidden="true"><path d="M19 20L9 12l10-8v16z"></path><rect x="4" y="4" width="2.5" height="16" rx="1"></rect></svg>
      </button>
      <button class="pp" aria-label="{{playLabel}}" onClick="{{toggle}}" style="all: unset; cursor: pointer; width: 88px; height: 88px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 32px {{accentGlow}}">
        <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
        </sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 4l12 8-12 8V4z"></path></svg>
        </sc-if>
      </button>
      <button aria-label="Next track" onClick="{{next}}" style="all: unset; cursor: pointer; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 20px">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#F2F3F5" aria-hidden="true"><path d="M5 4l10 8-10 8V4z"></path><rect x="17.5" y="4" width="2.5" height="16" rx="1"></rect></svg>
      </button>
      <button aria-label="Repeat" aria-pressed="{{repeatPressed}}" onClick="{{toggleRepeat}}" style="all: unset; cursor: pointer; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{repeatColor}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
      </button>
    </div>

    <label style="display: flex; align-items: center; gap: 14px; width: 460px">
      <span style="font-size: 15px; color: #B3B5BD; width: 44px">{{elapsedLabel}}</span>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Seek</span>
      <input class="seek" type="range" min="0" max="{{current.dur}}" value="{{elapsed}}" onChange="{{seek}}" style="flex-grow: 1; height: 28px; accent-color: {{accent}}">
      <span style="font-size: 15px; color: #B3B5BD; width: 44px; text-align: right">{{durLabel}}</span>
    </label>

  </section>

  <section class="rise" style="animation-delay: 120ms; flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 16px">
      <div role="tablist" aria-label="Mood" style="position: relative; display: flex; padding-bottom: 12px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
          <sc-if value="{{t.active}}" hint-placeholder-val="{{ false }}"><button role="tab" aria-selected="true" onClick="{{t.pick}}" style="all: unset; cursor: pointer; width: 128px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: #FFFFFF">{{t.label}}</button></sc-if>
          <sc-if value="{{t.inactive}}" hint-placeholder-val="{{ true }}"><button role="tab" aria-selected="false" onClick="{{t.pick}}" style="all: unset; cursor: pointer; width: 128px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #B3B5BD">{{t.label}}</button></sc-if>
        </sc-for>
        <div class="ind" style="position: absolute; bottom: 4px; left: {{tabLeft}}; width: 40px; height: 5px; border-radius: 3px; background: {{accent}}; box-shadow: 0 0 14px {{accentGlow}}"></div>
      </div>
      <label style="margin-left: auto; display: flex; align-items: center; gap: 10px; width: 200px; height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 24px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.10)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3B5BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search music</span>
        <input type="search" placeholder="Search songs" value="{{query}}" onChange="{{search}}" style="all: unset; width: 100%; font-size: 16px; color: #F2F3F5">
      </label>
    </div>

    <div class="stagger" role="list" style="display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding: 2px 8px 24px 2px; flex-grow: 1; min-height: 0">
      <sc-for list="{{tracks}}" as="tr" hint-placeholder-count="9">
        <div role="listitem" class="row" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 10px; border-radius: 20px; background: {{tr.rowBg}}; border: 1px solid {{tr.rowBorder}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08)">
          <button aria-label="Play {{tr.title}}" onClick="{{tr.pick}}" style="all: unset; cursor: pointer; flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 16px; min-height: 56px">
            <span style="position: relative; flex-shrink: 0; width: 56px; height: 56px; border-radius: 14px; background: {{tr.art}}; box-shadow: 0 6px 16px rgba(4,4,8,0.45), inset 0 0 0 1px rgba(255,255,255,0.2)">
              <sc-if value="{{tr.showEq}}" hint-placeholder-val="{{ false }}">
                <span class="eqbars" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; background: rgba(12,12,16,0.45)">
                  <span style="width: 4px; height: 20px; border-radius: 2px; background: #FFFFFF"></span>
                  <span style="width: 4px; height: 20px; border-radius: 2px; background: #FFFFFF"></span>
                  <span style="width: 4px; height: 20px; border-radius: 2px; background: #FFFFFF"></span>
                </span>
              </sc-if>
            </span>
            <span style="min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 19px; font-weight: 600; color: {{tr.titleColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tr.title}}</span>
              <span style="font-size: 15px; color: #B3B5BD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tr.artist}}</span>
            </span>
            <span style="margin-left: auto; flex-shrink: 0; font-size: 15px; color: #B3B5BD">{{tr.durLabel}}</span>
          </button>
          <button aria-label="More options for {{tr.title}}" aria-expanded="{{tr.menuExpanded}}" onClick="{{tr.toggleMenu}}" style="all: unset; cursor: pointer; flex-shrink: 0; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 14px">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#C8CAD1" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
          </button>
        </div>
        <sc-if value="{{tr.menuOpen}}" hint-placeholder-val="{{ false }}">
          <div class="pop-in" style="display: flex; gap: 8px; margin: -4px 0 4px 78px">
            <button onClick="{{tr.playNext}}" style="all: unset; cursor: pointer; padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.16); font-size: 15px; font-weight: 600">Play next</button>
            <button onClick="{{tr.addQueue}}" style="all: unset; cursor: pointer; padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.16); font-size: 15px; font-weight: 600">Add to queue</button>
            <button onClick="{{tr.like}}" style="all: unset; cursor: pointer; padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.16); font-size: 15px; font-weight: 600">{{tr.likeLabel}}</button>
          </div>
        </sc-if>
      </sc-for>
      <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 40px 0; text-align: center; font-size: 17px; color: #B3B5BD">No songs match “{{query}}”</div>
      </sc-if>
    </div>
  </section>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div class="toast" role="status" style="position: absolute; left: 50%; bottom: 28px; z-index: 40; transform: translateX(-50%); padding: 14px 22px; border-radius: 18px; background: rgba(22,23,28,0.88); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 16px 40px rgba(0,0,0,0.45); font-size: 16px; color: #F2F3F5; white-space: nowrap">{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Violet","Ocean","Emerald","Rose"],"default":"Violet"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  themeVals() {
    const T = {
      Violet: { a: '#7C5CFF', g: ['#3B3368', '#2A2C33', '#1D1E24', '#0E0F12'] },
      Ocean: { a: '#2563EB', g: ['#1F3D73', '#2A2C33', '#1D1E24', '#0E0F12'] },
      Emerald: { a: '#047857', g: ['#0F4A3F', '#2A2C33', '#1D1E24', '#0E0F12'] },
      Rose: { a: '#BE185D', g: ['#5A1F45', '#2A2C33', '#1D1E24', '#0E0F12'] }
    };
    const name = (this.state && this.state.theme) || this.props.theme || 'Violet';
    const t = T[name] || T.Violet;
    const g = t.g;
    return {
      accent: t.a,
      themeName: name,
      ground: 'radial-gradient(680px 460px at 10% -12%, ' + g[0] + ' 0%, transparent 62%), radial-gradient(700px 520px at 105% 110%, ' + g[1] + ' 0%, transparent 60%), radial-gradient(520px 380px at 70% 20%, ' + g[2] + ' 0%, transparent 70%), ' + g[3],
      themes: Object.keys(T).map((n) => ({ label: n, swatch: T[n].a, active: n === name, inactive: n !== name, pick: () => this.setState({ theme: n }) }))
    };
  }
  constructor(props) {
    super(props);
    this.state = { playing: true, idx: 0, tab: 'All', elapsed: 0, repeat: false, lyrics: false, shuffle: false, query: '', menu: -1, liked: {}, toast: '', volume: 18, muted: false, volOpen: false };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (!this.state.playing) return;
      const dur = this.trackList()[this.state.idx].dur;
      if (this.state.elapsed + 1 >= dur) {
        if (this.state.repeat) this.setState({ elapsed: 0 });
        else this.go(1);
      } else {
        this.setState({ elapsed: this.state.elapsed + 1 });
      }
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.toastT); }
  trackList() {
    const arts = [
      'linear-gradient(160deg, #F7B2A8 0%, #7A5CFF 100%)',
      'linear-gradient(160deg, #FFD39A 0%, #B35C3C 100%)',
      'linear-gradient(160deg, #7FE0D0 0%, #1B5E6B 100%)',
      'linear-gradient(160deg, #C9D6FF 0%, #B07BE8 100%)',
      'linear-gradient(160deg, #6AA8FF 0%, #22337A 100%)',
      'linear-gradient(160deg, #D9D9E3 0%, #4A4A55 100%)',
      'linear-gradient(160deg, #9AB8FF 0%, #5D3FA0 100%)',
      'linear-gradient(160deg, #9FE3C9 0%, #2F6F66 100%)',
      'linear-gradient(160deg, #F6A6C1 0%, #6B2D5C 100%)'
    ];
    const moods = ['Morning', 'Afternoon', 'Evening'];
    const durs = [212, 245, 198, 230, 187, 263, 205, 241, 220];
    return arts.map((art, i) => ({ id: i, title: '[Track ' + (i + 1) + ']', artist: '[Artist]', art, mood: moods[i % 3], dur: durs[i] }));
  }
  go(step) {
    const n = this.trackList().length;
    let next = (this.state.idx + step + n) % n;
    if (this.state.shuffle && n > 1) { do { next = Math.floor(Math.random() * n); } while (next === this.state.idx); }
    this.setState({ idx: next, elapsed: 0, playing: true });
  }
  showToast(msg) { clearTimeout(this.toastT); this.setState({ toast: msg }); this.toastT = setTimeout(() => this.setState({ toast: '' }), 2200); }
  renderVals() {
    const tv = this.themeVals();
    const s = this.state;
    const list = this.trackList();
    const current = list[s.idx];
    const fmt = (x) => Math.floor(x / 60) + ':' + String(Math.floor(x % 60)).padStart(2, '0');
    const tabNames = ['All', 'Morning', 'Afternoon', 'Evening'];
    const tabIdx = tabNames.indexOf(s.tab);
    const q = s.query.trim().toLowerCase();
    const shown = (s.tab === 'All' ? list : list.filter((t) => t.mood === s.tab)).filter((t) => !q || (t.title + ' ' + t.artist).toLowerCase().includes(q));
    return {
      ...tv,
      accentGlow: tv.accent + '88',
      current,
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? 'Pause' : 'Play',
      spinState: s.playing ? 'running' : 'paused',
      armTransform: s.playing ? 'rotate(0deg)' : 'rotate(-26deg)',
      showDisc: !s.lyrics,
      lyrics: s.lyrics,
      lyricsPressed: s.lyrics ? 'true' : 'false',
      lyricsBg: s.lyrics ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.07)',
      repeatPressed: s.repeat ? 'true' : 'false',
      repeatColor: s.repeat ? '#FFFFFF' : '#B3B5BD',
      elapsed: s.elapsed,
      elapsedLabel: fmt(s.elapsed),
      durLabel: fmt(current.dur),
      tabLeft: (tabIdx * 128 + 44) + 'px',
      tabs: tabNames.map((t) => ({ label: t, active: t === s.tab, inactive: t !== s.tab, pick: () => this.setState({ tab: t }) })),
      tracks: shown.map((t) => ({ ...t, menuOpen: s.menu === t.id, menuExpanded: s.menu === t.id ? 'true' : 'false', toggleMenu: () => this.setState({ menu: s.menu === t.id ? -1 : t.id }), playNext: () => { this.setState({ menu: -1 }); this.showToast(t.title + ' will play next'); }, addQueue: () => { this.setState({ menu: -1 }); this.showToast(t.title + ' added to queue'); }, likeLabel: s.liked[t.id] ? 'Unlike' : 'Like', like: () => { const liked = { ...s.liked, [t.id]: !s.liked[t.id] }; this.setState({ liked, menu: -1 }); this.showToast(liked[t.id] ? 'Added to liked songs' : 'Removed from liked songs'); }, showEq: t.id === s.idx && s.playing, durLabel: fmt(t.dur), rowBg: t.id === s.idx ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.05)', rowBorder: t.id === s.idx ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.08)', titleColor: t.id === s.idx ? '#FFFFFF' : '#F2F3F5', pick: () => this.setState({ idx: t.id, elapsed: 0, playing: true }) })),
      toggle: () => this.setState({ playing: !s.playing }),
      prev: () => (s.elapsed > 3 ? this.setState({ elapsed: 0 }) : this.go(-1)),
      next: () => this.go(1),
      toggleRepeat: () => { this.setState({ repeat: !s.repeat }); this.showToast(s.repeat ? 'Repeat off' : 'Repeat this song'); },
      shufflePressed: s.shuffle ? 'true' : 'false',
      shuffleColor: s.shuffle ? '#FFFFFF' : '#B3B5BD',
      toggleShuffle: () => { this.setState({ shuffle: !s.shuffle }); this.showToast(s.shuffle ? 'Shuffle off' : 'Shuffle on'); },
      query: s.query,
      search: (e) => this.setState({ query: e.target.value }),
      noResults: shown.length === 0,
      hasToast: !!s.toast,
      toast: s.toast,
      volume: s.muted ? 0 : s.volume,
      volLabel: s.muted || s.volume === 0 ? 'Muted' : String(s.volume),
      setVolume: (e) => this.setState({ volume: Number(e.target.value), muted: Number(e.target.value) === 0 }),
      muted: s.muted || s.volume === 0,
      unmuted: !(s.muted || s.volume === 0),
      mutedPressed: s.muted ? 'true' : 'false',
      muteLabel: s.muted ? 'Unmute' : 'Mute',
      toggleMute: () => this.setState({ muted: !s.muted, volume: s.volume === 0 ? 12 : s.volume }),
      volOpen: s.volOpen,
      volExpanded: s.volOpen ? 'true' : 'false',
      volBtnBg: s.volOpen ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.07)',
      toggleVol: () => this.setState({ volOpen: !s.volOpen }),
      toggleLyrics: () => this.setState({ lyrics: !s.lyrics }),
      seek: (e) => this.setState({ elapsed: Number(e.target.value) })
    };
  }
}
</script>
